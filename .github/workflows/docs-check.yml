name: Docs checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate docs and browser interactions
        uses: ./.github/actions/validate-docs
        with:
          fern-token: ${{ secrets.FERN_TOKEN }}
