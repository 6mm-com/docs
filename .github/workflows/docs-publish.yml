name: Publish docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate docs and browser interactions
        uses: ./.github/actions/validate-docs
        with:
          fern-token: ${{ secrets.FERN_TOKEN }}

      # Both gates above must pass; avoid repeating the local prepublish hook.
      - name: Publish to Fern production
        run: ./node_modules/.bin/fern generate --docs --no-prompt
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
