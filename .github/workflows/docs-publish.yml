name: Publish docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run check
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Publish to Fern production
        run: npm run fern:publish -- --no-prompt
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
