name: Publish docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run check
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Install browser regression dependencies
        run: npm ci --prefix tests/browser --ignore-scripts

      - name: Install regression browsers
        working-directory: tests/browser
        run: npm run install:browsers -- --with-deps

      - name: Verify browser interactions
        run: npm run browser:check

      # Both gates above must pass; avoid repeating the local prepublish hook.
      - name: Publish to Fern production
        run: ./node_modules/.bin/fern generate --docs --no-prompt
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
